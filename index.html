<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob: http: https:"
    />
    <link rel="stylesheet" href="/src/ui.css" />
    <title>LiveMatrix</title>
  </head>

  <body>
    <header id="toolbar">
      <div class="brand">
        <span class="logo">◧</span>
        <b>巡游天国保安室</b>
      </div>
      <div id="loginChips"></div>
      <button id="favBtn" type="button" title="收藏夹">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" /></svg
        >收藏
      </button>
      <div class="win-controls">
        <button id="winMin" class="wc" type="button" title="最小化"><i class="ic-min"></i></button>
        <button id="winMax" class="wc" type="button" title="最大化 / 还原"><i class="ic-max"></i></button>
        <button id="winClose" class="wc close" type="button" title="关闭"><i class="ic-close"></i></button>
      </div>
    </header>

    <main id="stage"></main>

    <div id="modalBack" class="modal-back hidden">
      <form id="addForm" class="modal">
        <h3>添加直播窗口</h3>
        <label for="urlInput">直播地址</label>
        <input
          id="urlInput"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="例如 https://live.bilibili.com/xxx 或 https://live.douyin.com/xxx"
        />
        <div id="platHint" class="hint">支持：哔哩哔哩直播 · 抖音直播</div>
        <div id="addErr" class="err"></div>
        <div class="row">
          <button type="button" id="cancelBtn" class="ghost">取消</button>
          <button type="submit" class="primary">添加</button>
        </div>
      </form>
    </div>

    <div id="favBack" class="modal-back hidden">
      <form id="favForm" class="modal">
        <h3>收藏直播</h3>
        <label for="favAlias">自定义别名</label>
        <input id="favAlias" type="text" spellcheck="false" autocomplete="off" maxlength="40" />
        <div class="row">
          <button type="button" id="favCancel" class="ghost">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </div>

    <div id="groupBack" class="modal-back hidden">
      <form id="groupForm" class="modal">
        <h3 id="groupTitle">新建分组</h3>
        <label for="groupInput">分组名称</label>
        <input
          id="groupInput"
          type="text"
          spellcheck="false"
          autocomplete="off"
          maxlength="40"
          placeholder="例如：常看主播"
        />
        <div class="row">
          <button type="button" id="groupCancel" class="ghost">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </div>

    <div id="favWrap" class="fav-wrap hidden">
      <div id="favShade" class="fav-shade"></div>
      <aside id="favPanel" class="fav-panel">
        <div class="fav-head">
          <b>收藏夹</b>
          <div class="fav-head-ops">
            <button id="favGroupAdd" type="button" title="新建分组"></button>
            <button id="favImport" type="button" title="导入收藏"></button>
            <button id="favExport" type="button" title="导出收藏"></button>
            <button id="favClose" type="button" title="收起"></button>
          </div>
        </div>
        <div id="favList" class="fav-list"></div>
        <div class="fav-tip"></div>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
